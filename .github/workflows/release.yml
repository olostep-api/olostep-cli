# Release workflow for olostep-cli.
#
# Triggers on push of any `v*` tag (e.g. `v0.3.0`, `v1.0.0-beta.1`).
# - `test`     runs typecheck + tests + build on Ubuntu × Node 18/20/22.
# - `publish`  stamps package.json to the tag version and publishes to npm
#              with provenance under the public access scope.
# - `release`  creates a GitHub Release with auto-generated notes.
#
# Required repo secret: NPM_TOKEN (npm automation token with publish rights).

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    # Needed by npm publish --provenance to sign the package.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Stamp package.json version from tag + pick dist-tag
        # GITHUB_REF_NAME is e.g. "v0.3.0" — strip the leading "v" and pin
        # package.json to that exact version so the publish matches the tag.
        # Prerelease versions (contain a "-", per SemVer 9) publish to the
        # `next` dist-tag instead of `latest`, so a tag like v0.2.0-dev.0
        # doesn't make every user `npm install -g olostep-cli` get the
        # prerelease. npm does NOT auto-detect prereleases — you have to
        # pass --tag explicitly.
        id: stamp
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then DIST_TAG="next"; else DIST_TAG="latest"; fi
          echo "Publishing version $VERSION to dist-tag $DIST_TAG"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$([[ "$DIST_TAG" == "next" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance --tag "${{ steps.stamp.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    outputs:
      version: ${{ steps.stamp.outputs.version }}
      dist_tag: ${{ steps.stamp.outputs.dist_tag }}
      is_prerelease: ${{ steps.stamp.outputs.is_prerelease }}

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # Mark prereleases as prerelease on GitHub so they don't show up
          # as "Latest release" on the repo page.
          prerelease: ${{ needs.publish.outputs.is_prerelease == 'true' }}
